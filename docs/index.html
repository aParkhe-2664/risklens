const A=[['RELIANCE','Reliance Industries','Stocks',2945,.24,.10],['TCS','Tata Consultancy','Stocks',4120,.20,.08],['HDFCBANK','HDFC Bank','Stocks',1680,.21,.06],['INFY','Infosys','Stocks',1890,.25,.09],['ITC','ITC Ltd','Stocks',478,.19,.11],['TATAMOTORS','Tata Motors','Stocks',962,.34,.12],['SBIN','State Bank of India','Stocks',812,.28,.13],['ADANIENT','Adani Enterprises','Stocks',2480,.42,.05],

['PPFAS','Parag Parikh Flexi Cap','Funds',82.4,.12,.14],['SMALLCAP','Nippon Small Cap','Funds',168,.2,.18],['BLUECHIP','SBI Bluechip','Funds',96,.13,.1],['LIQUID','HDFC Liquid','Funds',4850,.01,.07],
['USDINR','US Dollar / INR','Forex',88.2,.04,.02],['EURINR','Euro / INR','Forex',102.5,.07,.01],['GBPINR','Pound / INR','Forex',117.8,.08,.01],['JPYINR','Yen / INR','Forex',.57,.09,-.02],
['GOLD','Gold (MCX, per 10 g)','Commodities',125000,.15,.12],['SILVER','Silver (MCX, per kg)','Commodities',165000,.28,.15],['CRUDEOIL','Crude Oil (MCX, per bbl)','Commodities',5400,.32,0],['NATGAS','Natural Gas (MCX)','Commodities',260,.55,-.02],['COPPER','Copper (MCX, per kg)','Commodities',1050,.2,.08],
['BTC','Bitcoin (INR)','Crypto',8800000,.6,.2],['ETH','Ethereum (INR)','Crypto',280000,.75,.15],['SOL','Solana (INR)','Crypto',14000,.85,.1],
['GSEC10Y','GOI 10-Year G-Sec','Bonds',101.2,.03,.07],['GSEC5Y','GOI 5-Year G-Sec','Bonds',100.4,.02,.065],['SGB','Sovereign Gold Bond','Bonds',12900,.15,.12],['SDL','State Development Loan','Bonds',100.8,.03,.07],['NHAI','NHAI Tax-free Bond','Bonds',1085,.04,.06],
['NIFTYBEES','Nippon Nifty BeES','ETFs',270,.13,.09],['BANKBEES','Nippon Bank BeES','ETFs',540,.16,.07],['GOLDBEES','Nippon Gold BeES','ETFs',85,.15,.12],['ITBEES','Nippon IT BeES','ETFs',42,.2,.08],['LIQUIDBEES','Nippon Liquid BeES','ETFs',1000,.005,.065],
['NIFTYFUT','Nifty 50 Futures (near month)','Futures',24920,.14,.09],['BNIFTYFUT','Bank Nifty Futures','Futures',53350,.17,.07],['RELFUT','Reliance Futures','Futures',2952,.25,.1],['TCSFUT','TCS Futures','Futures',4130,.21,.08],['SBINFUT','SBI Futures','Futures',814,.29,.13]].map((a,i)=>({s:a[0],n:a[1],t:a[2],p:a[3],v:a[4],mu:a[5],sd:i+7,y:YS[a[0]]}));
const BY=Object.fromEntries(A.map(a=>[a.s,a])),TABS=['Stocks','Indices','ETFs','Funds','Bonds','Futures','Commodities','Forex','Crypto'],COL=['#0088EA','#19AF55','#624BFF','#8A6F05','#E23D3D','#8398AF','#D82F44','#535B62','#FF9F1C','#2EC4B6'];
let DT=(()=>{let d=new Date(),a=[];while(a.length<253){if(d.getDay()%6)a.unshift(d.toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'2-digit'}));d.setDate(d.getDate()-1)}return a})();
const rng=s=>()=>{s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
const mean=a=>a.reduce((s,v)=>s+v,0)/a.length,sdv=a=>{const m=mean(a);return Math.sqrt(mean(a.map(v=>(v-m)**2)))};
function ser(a){if(a._s)return a._s;const R=rng(a.sd*977),sg=a.v/15.87;let x=1,px=[1];for(let i=0;i<252;i++){let z=Math.sqrt(-2*Math.log(R()+1e-9))*Math.cos(6.2832*R()),r=a.mu/252+sg*z;if(R()<.012&&a.v>.05)r-=sg*4;x*=Math.exp(r);px.push(x)}const k=a.p/px[252];px=px.map(v=>v*k);return a._s={px,r:px.slice(1).map((v,i)=>Math.log(v/px[i]))}}
function met(r){const px=[1];r.forEach(v=>px.push(px[px.length-1]*Math.exp(v)));let pk=1,mdd=0;px.forEach(v=>{pk=Math.max(pk,v);mdd=Math.max(mdd,1-v/pk)});
const q=[...r].sort((a,b)=>a-b),var95=-q[Math.floor(r.length*.05)],vol=sdv(r)*Math.sqrt(252),m=mean(r),sg=sdv(r),an=[];r.forEach((v,i)=>{if(v<0&&(v-m)/sg<-2.2)an.push(i)});
const c={vol:Math.min(vol/.5,1)*100,mdd:Math.min(mdd/.4,1)*100,var:Math.min(var95/.05,1)*100,an:Math.min(an.length/8,1)*100};
return{vol,mdd,var95,an,c,score:Math.round(.4*c.vol+.3*c.mdd+.2*c.var+.1*c.an),ret:px[px.length-1]-1}}
const MT=a=>a._m||(a._m=met(ser(a).r)),d1=a=>Math.exp(ser(a).r[251])-1,y1=a=>{const p=ser(a).px;return p[252]/p[0]-1};
const band=s=>s<35?['Low','var(--g)']:s<65?['Medium','var(--y)']:['High','var(--r)'];

const meter=s=>`<div class="meter"><i style="width:${s}%;background:${band(s)[1]}"></i></div>`;
function pf(){const it=Object.entries(S.h).map(([k,q])=>({a:BY[k],q,val:q*BY[k].p})),total=it.reduce((s,i)=>s+i.val,0);it.forEach(i=>i.w=i.val/total);
if(!it.length)return{it,total:0};const pr=DT.slice(1).map((_,j)=>it.reduce((s,i)=>s+i.w*ser(i.a).r[j],0)),m=met(pr),cum=[];let c=0;pr.forEach(v=>cum.push(c+=v));
return{it,total,pr,m,vals:[total*Math.exp(-c),...cum.map(x=>total*Math.exp(x-c))]}}
let LIVE=false;
async function loadLive(){if(!API)return;try{const ys=A.filter(a=>a.y).map(a=>a.y),d=await(await fetch(API+'/api/prices?symbols='+encodeURIComponent(ys.join(',')))).json();if(!d.dates||d.dates.length!==253)throw new Error('bad payload');DT=d.dates;A.forEach(a=>{const c=a.y&&d.series[a.y];if(c&&c.length===253){a._s={px:c,r:c.slice(1).map((v,i)=>Math.log(v/c[i]))};a.p=c[252];a._m=null;a.live=true}});LIVE=true;if(S.v==='app')render()}catch(e){console.warn('Live data unavailable, using simulated data',e)}}

function dash(){const p=pf(),ix=A.filter(a=>a.t==='Indices'),mv=A.filter(a=>a.t==='Stocks').sort((a,b)=>d1(b)-d1(a)),li=a=>`<div class="row" style="padding:6px 0"><span>${a.n}<small>${a.s}</small></span><span>₹${f(a.p)} ${P(d1(a))}</span></div>`;

function port(){const p=pf();if(!p.it.length)return`<h1>Portfolio</h1><div class="grid">${empty()}</div>`;const m=p.m,b=band(m.score),n=p.it.length;let cs=[],k=0;for(let i=0;i<n;i++)for(let j=i+1;j<n;j++){const x=ser(p.it[i].a).r,y=ser(p.it[j].a).r,mx=mean(x),my=mean(y);cs.push(mean(x.map((v,t)=>(v-mx)*(y[t]-my)))/(sdv(x)*sdv(y)))}const ac=cs.length?mean(cs):0;
const hm=n>1?`<div class="card tw"><h3>Correlation heatmap</h3><table class="hm"><tr><td></td>${p.it.map(i=>`<td><b>${i.a.s}</b></td>`).join('')}</tr>${p.it.map(i=>`<tr><td><b>${i.a.s}</b></td>${p.it.map(j=>{const x=ser(i.a).r,y=ser(j.a).r,mx=mean(x),my=mean(y),c=mean(x.map((v,t)=>(v-mx)*(y[t]-my)))/(sdv(x)*sdv(y));return`<td style="background:${c>=0?'rgba(0,136,234,':'rgba(226,61,61,'}${Math.abs(c).toFixed(2)})">${c.toFixed(2)}</td>`}).join('')}</tr>`).join('')}</table><p class="mu">Average pairwise correlation: <b>${ac.toFixed(2)}</b> – ${ac>.6?'low diversification':ac>.3?'moderate diversification':'good diversification'}.</p></div>`:'';
return`<h1>Portfolio</h1><div class="grid g4"><div class="card"><small>Value</small><div class="kpi">₹${f(p.total,0)}</div></div><div class="card"><small>Composite risk score</small><div class="kpi" style="color:${b[1]}">${m.score} · ${b[0]}</div>${meter(m.score)}</div><div class="card"><small>Ann. volatility</small><div class="kpi">${(m.vol*100).toFixed(1)}%</div></div><div class="card"><small>Max drawdown</small><div class="kpi dn">−${(m.mdd*100).toFixed(1)}%</div></div><div class="card"><small>95% 1-day VaR</small><div class="kpi dn">₹${f(m.var95*p.total,0)}</div><small>${(m.var95*100).toFixed(2)}% of value</small></div><div class="card"><small>Abnormal drops flagged</small><div class="kpi">${m.an.length}</div></div></div>
<div class="card tw" style="padding:0"><table><thead><tr><th>Asset</th><th>Units</th><th>Value</th><th>Weight</th><th>Risk</th><th></th></tr></thead><tbody>${p.it.map(i=>`<tr data-a="open" data-s="${i.a.s}"><td><b>${i.a.n}</b><small>${i.a.t}</small></td><td><button class="btn s o" data-a="q" data-s="${i.a.s}" data-d="-1">−</button> ${i.q} <button class="btn s o" data-a="q" data-s="${i.a.s}" data-d="1">+</button></td><td>₹${f(i.val,0)}</td><td>${(i.w*100).toFixed(1)}%</td><td>${badge(MT(i.a).score)}</td><td><button class="btn s o" data-a="rm" data-s="${i.a.s}">Remove</button></td></tr>`).join('')}</tbody></table></div>
<div class="grid g2"><div class="card"><h3>Allocation by asset class</h3><div class="ch"><canvas id="c2"></canvas></div></div><div class="card"><h3>Allocation by holding</h3><div class="ch"><canvas id="c3"></canvas></div></div><div class="card"><h3>Risk contribution (weight × volatility)</h3><div class="ch"><canvas id="c4"></canvas></div></div><div class="card"><h3>Risk score breakdown</h3><div class="ch"><canvas id="c5"></canvas></div></div></div>
<div class="card"><h3>Portfolio value with flagged drops</h3><div class="ch"><canvas id="c6"></canvas></div></div><div class="grid">${hm}</div>`}
function draw(){const p=pf();if(!p.it.length)return;const cs=getComputedStyle(document.documentElement);Chart.defaults.color=cs.getPropertyValue('--mu');Chart.defaults.borderColor=cs.getPropertyValue('--bd');
if(S.pg==='dash')mk(CH,'c1','line',lineData(DT,p.vals,[],'Value'),{scales:xt,plugins:{legend:{display:false}}});
if(S.pg==='pf'){const cl={};p.it.forEach(i=>cl[i.a.t]=(cl[i.a.t]||0)+i.val);mk(CH,'c2','doughnut',{labels:Object.keys(cl),datasets:[{data:Object.values(cl),backgroundColor:COL,borderWidth:0}]});
mk(CH,'c3','doughnut',{labels:p.it.map(i=>i.a.s),datasets:[{data:p.it.map(i=>i.val),backgroundColor:COL,borderWidth:0}]});
mk(CH,'c4','bar',{labels:p.it.map(i=>i.a.s),datasets:[{data:p.it.map(i=>+(i.w*i.a.v*100).toFixed(2)),backgroundColor:COL}]},{plugins:{legend:{display:false}}});
mk(CH,'c5','bar',{labels:['Volatility','Drawdown','VaR','Anomalies'],datasets:[{data:Object.values(p.m.c).map(Math.round),backgroundColor:['#0088EA','#624BFF','#8A6F05','#E23D3D']}]},{indexAxis:'y',plugins:{legend:{display:false}},scales:{x:{max:100}}});
mk(CH,'c6','line',lineData(DT,p.vals,p.m.an,'Portfolio value'),{scales:xt})}}
function modal(s){const a=BY[s],m=MT(a),r=ser(a),el=$('#mo'),h=S.h[s],up=r.r.filter(v=>v>0).length;MC.forEach(c=>c.destroy());MC=[];
el.style.display='block';el.innerHTML=`<div class="card"><div class="row"><div><h2>${a.n}</h2><span class="mu">${a.s} · ${a.t} · ${a.live?'Live (yfinance)':'Simulated'}</span></div><div><button class="btn s ${h?'o':''}" data-a="add" data-s="${s}">${h?'✓ In portfolio':'+ Add to portfolio'}</button> <button class="btn s o" data-a="close">Close</button></div></div>
<div class="kpi" style="margin:12px 0">₹${f(a.p)} <span style="font-size:16px">${P(d1(a))}</span></div><div class="grid g4"><div class="card"><small>Ann. volatility</small><b class="kpi">${(m.vol*100).toFixed(1)}%</b></div><div class="card"><small>Max drawdown</small><b class="kpi dn">−${(m.mdd*100).toFixed(1)}%</b></div><div class="card"><small>95% daily VaR</small><b class="kpi dn">${(m.var95*100).toFixed(2)}%</b></div><div class="card"><small>Risk score</small><b class="kpi">${badge(m.score)}</b>${meter(m.score)}</div></div>
<div class="card"><h3>Price with flagged abnormal drops (${m.an.length})</h3><div class="ch"><canvas id="m1"></canvas></div></div><div class="grid g2"><div class="card"><h3>Trading days outcome</h3><div class="ch"><canvas id="m2"></canvas></div></div><div class="card"><h3>Risk score components</h3><div class="ch"><canvas id="m3"></canvas></div></div></div><p class="mu">Drops are flagged where a negative daily return is more than 2.2 standard deviations below the mean (a z-score stand-in for IsolationForest).</p></div>`;
mk(MC,'m1','line',lineData(DT,r.px,m.an,a.s),{scales:xt});
mk(MC,'m2','doughnut',{labels:['Up days','Down days','Abnormal drops'],datasets:[{data:[up,252-up-m.an.length,m.an.length],backgroundColor:['#19AF55','#8398AF','#E23D3D'],borderWidth:0}]});
mk(MC,'m3','bar',{labels:['Volatility','Drawdown','VaR','Anomalies'],datasets:[{data:Object.values(m.c).map(Math.round),backgroundColor:['#0088EA','#624BFF','#8A6F05','#E23D3D']}]},{indexAxis:'y',plugins:{legend:{display:false}},scales:{x:{max:100}}})}
function render(){CH.forEach(c=>c.destroy());CH=[];$('#app').innerHTML=S.v==='app'?shell():auth();if(S.v==='app')draw()}
function login(u){S.u=u;S.h=J('rl_h_'+u.e,{});S.v='app';S.pg='dash';st.s('rl_s',u.e);render()}
document.addEventListener('click',e=>{const t=e.target.closest('[data-a]');if(!t)return;const a=t.dataset.a,s=t.dataset.s,V=id=>(document.getElementById(id)||{}).value||'',U=J('rl_u',{}),err=m=>{S.msg=m;render()};
if(a==='go'){S.v=s;S.msg='';render()}
else if(a==='login'){const k=V('e').trim().toLowerCase(),u=U[k];if(!u||u.p!==btoa(V('p')))return err('Incorrect email or password.');login({e:k,name:u.n})}
else if(a==='signup'){const k=V('e').trim().toLowerCase();if(V('n').trim().length<2)return err('Please enter your name.');if(!/^\S+@\S+\.\S+$/.test(k))return err('Enter a valid email.');if(V('p').length<6)return err('Password must be at least 6 characters.');if(V('p')!==V('p2'))return err('Passwords do not match.');if(U[k])return err('An account with this email already exists.');U[k]={n:V('n').trim(),p:btoa(V('p'))};st.s('rl_u',JSON.stringify(U));login({e:k,name:U[k].n})}
else if(a==='reset'){const k=V('e').trim().toLowerCase();if(!U[k])return err('No account found for this email.');if(V('p').length<6)return err('Password must be at least 6 characters.');U[k].p=btoa(V('p'));st.s('rl_u',JSON.stringify(U));S.v='login';render();$('#er').className='err ok';$('#er').textContent='Password updated. Please log in.'}
else if(a==='logout'){st.d('rl_s');S.v='login';S.u=null;$('#mo').style.display='none';render()}
else if(a==='pg'){S.pg=s;$('#mo').style.display='none';render();scrollTo(0,0)}
else if(a==='tab'){S.tab=s;S.q='';render()}
else if(a==='theme'){const r=document.documentElement;r.dataset.theme=(r.dataset.theme||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light'))==='dark'?'light':'dark';render();if($('#mo').style.display==='block')modal(Object.keys(BY).find(k=>BY[k].n===$('#mo h2').textContent))}
else if(a==='add'){if(S.h[s]){toast('Already in portfolio – adjust units there');}else{S.h[s]=Math.max(1,Math.round(50000/BY[s].p));save();toast(BY[s].n+' added to portfolio')}render();if($('#mo').style.display==='block')modal(s)}
else if(a==='rm'){delete S.h[s];save();render();toast('Removed')}
else if(a==='q'){S.h[s]=Math.max(1,S.h[s]+ +t.dataset.d);save();render()}
else if(a==='open')modal(s);
else if(a==='close'){$('#mo').style.display='none'}});
document.addEventListener('input',e=>{if(e.target.id==='q'){S.q=e.target.value;$('#tb').innerHTML=rows()}});
$('#mo').addEventListener('click',e=>{if(e.target.id==='mo')e.target.style.display='none'});
(()=>{const U=J('rl_u',{});if(!U['demo@risklens.app']){U['demo@risklens.app']={n:'Demo Investor',p:btoa('demo123')};st.s('rl_u',JSON.stringify(U))}const k=st.g('rl_s');if(k&&U[k])login({e:k,name:U[k].n});else render()})();loadLive();
</script></body></html>
